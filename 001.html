<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BU Delivery Notification Portal (PIN)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .touch-btn { touch-action: manipulation; }
  </style>
</head>
<body class="bg-gray-100 min-h-screen text-gray-800 flex flex-col items-center justify-start p-4">

  <div class="max-w-md w-full space-y-4 bg-white p-6 rounded-2xl shadow-md">
    
    <!-- 標題 -->
    <div class="text-center pb-2 border-b">
      <h1 class="text-xl font-bold text-blue-600"><i class="fas fa-box-open mr-2"></i>BU 配送與攞貨系統</h1>
      <p class="text-xs text-gray-500 mt-1">請依照流程拍照後再點擊已攞貨</p>
    </div>

    <!-- 1. 影相 / 上傳照片區塊 -->
    <div class="space-y-2">
      <label class="block text-sm font-semibold text-gray-700">
        <i class="fas fa-camera mr-1 text-blue-500"></i> 拍照存證 (必需)
      </label>
      
      <!-- 隱藏的檔案上傳 input (支援手機直接拍照或選相簿) -->
      <input type="file" id="photoInput" accept="image/*" capture="environment" class="hidden" onchange="handlePhotoCapture(event)">
      
      <!-- 觸發拍照的按鈕 -->
      <button type="button" onclick="document.getElementById('photoInput').click()" class="w-full py-3 px-4 bg-blue-50 text-blue-600 border border-blue-300 rounded-xl font-medium flex items-center justify-center space-x-2 touch-btn active:bg-blue-100">
        <i class="fas fa-camera text-lg"></i>
        <span id="photoBtnText">點擊拍攝 / 上傳貨品相片</span>
      </button>

      <!-- 照片預覽區 -->
      <div id="previewContainer" class="hidden relative mt-2 text-center">
        <img id="photoPreview" src="" alt="Preview" class="mx-auto max-h-48 rounded-lg border shadow-sm">
        <span class="absolute top-2 right-2 bg-green-500 text-white text-xs px-2 py-1 rounded-full shadow">
          <i class="fas fa-check mr-1"></i> 已拍照
        </span>
      </div>
    </div>

    <!-- 2. 已攞貨提交按鈕 (預設鎖定 disabled) -->
    <div class="pt-4">
      <button type="button" id="btnComplete" onclick="submitDelivery()" disabled class="w-full py-3 px-4 bg-gray-300 text-gray-500 rounded-xl font-bold transition-all shadow-sm cursor-not-allowed touch-btn">
        <i class="fas fa-check-circle mr-1"></i> 已攞貨 (請先拍照)
      </button>
    </div>

  </div>

  <script>
    // 追蹤是否已拍照的狀態
    let isPhotoTaken = false;

    // 處理拍照/選相片後的動作
    function handlePhotoCapture(event) {
      const file = event.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
          // 顯示預覽圖片
          const preview = document.getElementById('photoPreview');
          preview.src = e.target.result;
          document.getElementById('previewContainer').classList.remove('hidden');
          document.getElementById('photoBtnText').innerText = '重新拍攝 / 更換相片';

          // 解鎖狀態
          isPhotoTaken = true;

          // 解鎖「已攞貨」按鈕樣式與功能
          const btn = document.getElementById('btnComplete');
          btn.disabled = false;
          btn.classList.remove('bg-gray-300', 'text-gray-500', 'cursor-not-allowed');
          btn.classList.add('bg-green-600', 'text-white', 'hover:bg-green-700', 'shadow-md');
          btn.innerHTML = '<i class="fas fa-check-circle mr-1"></i> 確認已攞貨';
        }
        reader.readAsDataURL(file);
      }
    }

    // 提交攞貨資料
    function submitDelivery() {
      // 雙重防護檢查
      if (!isPhotoTaken) {
        alert("⚠️ 請先拍照上傳，才可以點擊「已攞貨」！");
        return;
      }

      // 這裡可以加入你原本提交到後台或記錄的邏輯
      alert("✅ 攞貨成功紀錄已提交！");
      
      // 提交後的後續動作 (例如重新整理或清空)
      // location.reload(); 
    }
  </script>

</body>
</html>
