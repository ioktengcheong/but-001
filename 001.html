<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AMR Delivery BU Terminal</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #f3f4f6; padding: 16px; color: #1f2937; }
    .container { max-width: 600px; margin: 0 auto; }
    .card { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); margin-bottom: 16px; }
    h2 { font-size: 1.25rem; font-weight: 700; margin-bottom: 12px; color: #111827; }
    input, select, button { width: 100%; padding: 12px; margin-bottom: 12px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 1rem; }
    button { background-color: #2563eb; color: white; border: none; font-weight: 600; cursor: pointer; transition: background 0.2s; }
    button:hover { background-color: #1d4ed8; }
    button.btn-success { background-color: #16a34a; }
    button.btn-danger { background-color: #dc2626; }
    .status-badge { display: inline-block; padding: 6px 12px; border-radius: 9999px; font-weight: 600; font-size: 0.875rem; text-align: center; width: 100%; margin-bottom: 12px; }
    .status-arrived { background-color: #fef08a; color: #854d0e; }
    .status-completed { background-color: #bbf7d0; color: #166534; }
    .status-idle { background-color: #e5e7eb; color: #374151; }
    .audio-banner { background-color: #fef3c7; border: 1px solid #f59e0b; padding: 12px; border-radius: 8px; text-align: center; margin-bottom: 16px; cursor: pointer; font-weight: bold; color: #b45309; }
    .audio-banner.active { background-color: #dcfce7; border-color: #16a34a; color: #15803d; }
    .hidden { display: none; }
  </style>
</head>
<body>

<div class="container">

  <!-- Audio Enable Banner -->
  <div id="audioBanner" class="audio-banner" onclick="enableAudio()">
    🔔 點擊此處啟用警報音效與語音播報
  </div>

  <!-- Department Login View -->
  <div id="loginCard" class="card">
    <h2>🏢 部門登入 (BU Terminal Login)</h2>
    <input type="password" id="pinInput" placeholder="請輸入 4 位數部門 PIN 碼 (例如: 1234)" maxlength="4">
    <button onclick="handleLogin()">登入系統</button>
  </div>

  <!-- Main BU Dashboard -->
  <div id="dashboardCard" class="card hidden">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
      <h2 id="deptTitle">部門名稱</h2>
      <button onclick="handleLogout()" style="width: auto; padding: 6px 12px; margin: 0;" class="btn-danger">登出</button>
    </div>

    <!-- Live Mission Status -->
    <div class="card" style="background: #f9fafb; border: 1px solid #e5e7eb;">
      <h2>🚚 AMR 當前任務狀態</h2>
      <div id="statusBadge" class="status-badge status-idle">無進行中任務</div>
      <div id="missionDetails" class="hidden">
        <p><strong>任務編號:</strong> <span id="missionIdVal">-</span></p>
        <p><strong>發貨地點:</strong> <span id="originVal">-</span></p>
        <p><strong>抵達時間:</strong> <span id="arrivalTimeVal">-</span></p>
        <div style="margin-top: 16px;">
          <button class="btn-success" onclick="completeMission()">✅ 確認收貨並釋放 AMR</button>
        </div>
      </div>
    </div>

    <!-- Quick Simulation Trigger for Testing -->
    <div class="card" style="background: #eff6ff; border: 1px solid #bfdbfe; margin-bottom: 0;">
      <h2>🧪 測試推播觸發器 (Simulation)</h2>
      <button onclick="simulateArrival()">🚀 模擬 AMR 抵達本部門 (觸發 Telegram 通知)</button>
    </div>
  </div>

</div>

<script>
// ==================== 1. 全局配置與 Telegram 設定 ====================
const TELEGRAM_BOT_TOKEN = "9157691891:AAEAKmuToYTM1xu6K4ZNn7KbW6X7AFXql4g";

// 部門與 Telegram Group Chat ID 對應表
const DEPT_TG_CONFIG = {
  "RC Cafe": "-537615630" // 專屬 RC Cafe Telegram 群組 ID
  // 今後新增部門只需加在此處，例如:
  // "Staff Canteen": "-1002233445566",
  // "Housekeeping": "-1009988776655"
};

// 預備個人 ID (若未匹配到部門群組時的備用 Target)
const DEFAULT_PERSONAL_CHAT_ID = "9241144859";

// PIN 碼與部門名稱對應表
const PIN_MAP = {
  "1234": "RC Cafe",
  "2222": "Staff Canteen",
  "3333": "Housekeeping"
};

let currentDept = "";
let isAudioEnabled = false;
let audioContext = null;

// ==================== 2. Telegram 訊息推播邏輯 ====================
/**
 * 發送 Telegram 到貨通知
 * @param {string} deptName - 目標部門
 * @param {string} textMessage - 推播文字內容
 */
function sendTelegramNotification(deptName, textMessage) {
  // 自動依部門匹配 Group Chat ID
  const targetChatId = DEPT_TG_CONFIG[deptName] || DEFAULT_PERSONAL_CHAT_ID;
  const endpoint = `https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`;

  fetch(endpoint, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      chat_id: targetChatId,
      text: textMessage,
      parse_mode: "HTML"
    })
  })
  .then(res => res.json())
  .then(data => {
    if(data.ok) {
      console.log(`[Telegram] 推播成功送達 [${deptName}] 群組 (${targetChatId})`);
    } else {
      console.error("[Telegram] 發送失敗:", data);
    }
  })
  .catch(err => console.error("[Telegram] 網絡異常:", err));
}

// ==================== 3. 語音與聲響警報邏輯 ====================
function enableAudio() {
  audioContext = new (window.AudioContext || window.webkitAudioContext)();
  isAudioEnabled = true;
  const banner = document.getElementById("audioBanner");
  banner.classList.add("active");
  banner.innerText = "🔊 警報音效與廣播已啟用";
}

function playBeepSound() {
  if (!isAudioEnabled || !audioContext) return;
  const osc = audioContext.createOscillator();
  const gain = audioContext.createGain();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(880, audioContext.currentTime); // A5 音高
  gain.gain.setValueAtTime(0.5, audioContext.currentTime);
  osc.connect(gain);
  gain.connect(audioContext.destination);
  osc.start();
  osc.stop(audioContext.currentTime + 0.6);
}

function speakSpeech(text) {
  if (!('speechSynthesis' in window)) return;
  const utterance = new SpeechSynthesisUtterance(text);
  utterance.lang = 'zh-HK'; // 廣東話播報
  utterance.rate = 1.0;
  window.speechSynthesis.speak(utterance);
}

// ==================== 4. 系統操作邏輯 ====================
function handleLogin() {
  const pin = document.getElementById("pinInput").value;
  if (PIN_MAP[pin]) {
    currentDept = PIN_MAP[pin];
    document.getElementById("deptTitle").innerText = "📍 部門: " + currentDept;
    document.getElementById("loginCard").classList.add("hidden");
    document.getElementById("dashboardCard").classList.remove("hidden");
    checkMissionStatus();
  } else {
    alert("PIN 碼錯誤！請重新輸入。");
  }
}

function handleLogout() {
  currentDept = "";
  document.getElementById("pinInput").value = "";
  document.getElementById("loginCard").classList.remove("hidden");
  document.getElementById("dashboardCard").classList.add("hidden");
}

function triggerArrivalAlert(missionId, origin) {
  const nowStr = new Date().toLocaleTimeString();
  
  // 1. 更新 UI
  document.getElementById("statusBadge").className = "status-badge status-arrived";
  document.getElementById("statusBadge").innerText = "⚠️ AMR 已抵達，請盡速領貨！";
  document.getElementById("missionIdVal").innerText = missionId;
  document.getElementById("originVal").innerText = origin;
  document.getElementById("arrivalTimeVal").innerText = nowStr;
  document.getElementById("missionDetails").classList.remove("hidden");

  // 2. 本地音效與廣播
  playBeepSound();
  speakSpeech(`請注意，自主移動機器人已抵達 ${currentDept}，請盡速前往領收物品。`);

  // 3. 發送 Telegram 訊息至部門群組
  const tgMessage = `🚨 <b>【AMR 到貨提醒】</b>\n\n` +
                    `📍 <b>目標部門:</b> ${currentDept}\n` +
                    `📦 <b>任務編號:</b> ${missionId}\n` +
                    `🏬 <b>出貨來源:</b> ${origin}\n` +
                    `⏰ <b>抵達時間:</b> ${nowStr}\n\n` +
                    `請部門相關人員儘速前往完成取貨作業。`;
  
  sendTelegramNotification(currentDept, tgMessage);
}

function completeMission() {
  document.getElementById("statusBadge").className = "status-badge status-completed";
  document.getElementById("statusBadge").innerText = "✅ 任務已完成";
  document.getElementById("missionDetails").classList.add("hidden");

  // 發送完成收貨通知至 Telegram 群組
  const tgMessage = `✅ <b>【AMR 取貨完成】</b>\n\n` +
                    `📍 <b>部門:</b> ${currentDept}\n` +
                    `⏰ <b>完成時間:</b> ${new Date().toLocaleTimeString()}\n` +
                    `AMR 已經被釋放並返回中央管制塔。`;
  
  sendTelegramNotification(currentDept, tgMessage);
}

function simulateArrival() {
  const randomId = "MS-" + Math.floor(1000 + Math.random() * 9000);
  triggerArrivalAlert(randomId, "Central Warehouse Zone A");
}

function checkMissionStatus() {
  // 可擴充由 LocalStorage 或 WebSocket 讀取即時狀態
}
</script>

</body>
</html>
